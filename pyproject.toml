[project]
name = "h3-turbo-runtime"
version = "1.0.0"
description = "High-performance native audio-video inference runtime for MiniMax H3 on consumer GPUs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "triton>=3.0.0",
    "comfy-kitchen>=0.2.41",
    "comfy-aimdo>=0.6.0",
    "comfyui-frontend-package>=1.59.11",
    "safetensors>=0.4.3",
    "transformers>=4.40.0",
    "tokenizers>=0.19.0",
    "torchsde>=0.2.6",
    "sentencepiece>=0.2.0",
    "einops>=0.8.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0.1",
    "av>=11.0.0",
    "tqdm>=4.65.0",
    "aiohttp>=3.9.0",
    "psutil>=5.9.0",
    "scipy>=1.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    ".",
    "runtime",
    "runtime/src",
    "custom_nodes/h3_turbo_runtime",
]
